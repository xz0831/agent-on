name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  agent-on:
    # docs/superpowers/specs/2026-09-07-agent-on-design.md: stdlib only. Sources are unreachable on CI; the gate
    # reports those as listed skips, never as passes.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Reports land in RUNNER_TEMP, not the checkout: a file written beside the code would make copy.dirty true.
      - name: agent-on gate
        run: AGENT_ON_STATE="$RUNNER_TEMP/agent-on-state" ./bin/agent-on gate --json | tee "$RUNNER_TEMP/gate.json"

      - name: Assert the gate passed with its skips listed
        run: |
          python - <<'PY'
          import json, os
          g = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "gate.json")))
          assert g["result"] == "pass", g["last_gate_run"]
          assert g["tests"]["ok"] is True and g["tests"]["ran"] > 200, g["tests"]
          assert g["smoke"]["ok"] is True, g["smoke"]
          inv = g["last_gate_run"]["invariants"]
          assert inv["credential.not_in_child_env"] == "pass"
          assert inv["knowledge.typed"] == "pass"
          assert inv["docs.current"] == "pass"
          PY

      - name: install into a scratch bin dir, then verify available and unavailable route boundaries
        run: |
          set -euo pipefail
          export AGENT_ON_STATE="$RUNNER_TEMP/agent-on-state"
          ./bin/agent-on install --bin-dir "$RUNNER_TEMP/bin" --json | tee "$RUNNER_TEMP/install.json"
          python - <<'PY'
          import json, os
          d = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "install.json")))
          assert d["written"], d
          assert {l["state"] for l in d["links"].values()} == {"linked"}, d["links"]
          PY
          python - <<'PY'
          import json, os, subprocess
          from agent_on.paths import default_paths
          from agent_on.schemas.routes import load_routes

          table = load_routes(default_paths())
          available, unavailable = [], []
          for route in table.routes.values():
              if not route.packaged:
                  continue
              source = table.sources[route.source]
              (available if source.available else unavailable).append(route.name)
          assert available, "CI must exercise at least one available packaged route"
          assert unavailable, "CI must exercise the host-local unavailable boundary"
          shim = os.path.join(os.environ["RUNNER_TEMP"], "bin", "claude-on")
          for route in available:
              run = subprocess.run([shim, "--json", "--dry-run", route, "-p", "hi"],
                                   text=True, capture_output=True)
              assert run.returncode == 0, (route, run.stdout, run.stderr)
          for route in unavailable:
              run = subprocess.run([shim, "--json", "--dry-run", route, "-p", "hi"],
                                   text=True, capture_output=True)
              assert run.returncode != 0, (route, run.stdout, run.stderr)
              error = json.loads(run.stdout)["error"]
              assert "unavailable on this host" in error, (route, error)
          PY
