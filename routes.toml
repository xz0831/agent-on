# agent-on route table — L1, the only declarations (spec §6). Git-tracked; edited by hand or by `agent-on add`.
# Route names are <source>/<model> (D10). Every numeric limit carries a confidence and a source.
# The GPT and xAI OAuth routes the old gateway packaged are deliberately absent (D3).
version = 1

[sources.openrouter]
base_url = "https://openrouter.ai/api"
auth_env = "OPENROUTER_API_KEY"
catalog  = "https://openrouter.ai/api/v1/models"
backend  = "openrouter"
billing  = "metered"

# Historical source identity retained as an unavailable tombstone so append-only knowledge and observations keep
# their original meaning. Known old CLI route names redirect below; no launch resolves to this source.
[sources.omlx]
available = false
backend = "omlx"
billing = "free"

[sources."omlx@rick"]
available = false
auth_env = "OMLX_RICK_API_KEY"
catalog  = "/v1/models"
discover = true
backend  = "omlx"
billing  = "free"

[sources."omlx@rick".limits]
input      = 131072
output     = 32768
confidence = "configured"
source     = "~/.omlx/settings.json sampling.max_context_window / sampling.max_tokens (read 2026-09-07)"

[sources."omlx@morty"]
available = false
auth_env = "OMLX_MORTY_API_KEY"
catalog  = "/v1/models"
discover = true
backend  = "omlx"
billing  = "free"

[sources."omlx@morty".limits]
input      = 32768
confidence = "configured"
source     = "Morty /Users/morty/.omlx-dflash/settings.json sampling.max_context_window observed 2026-09-20; output cap not asserted; do not infer Rick's settings through the SSH forward"

[sources."omlx@xz0831"]
available = false
catalog  = "/v1/models"
discover = true
backend  = "omlx"
billing  = "free"

[sources."omlx@xz0831".limits]
input      = 32768
output     = 32768
confidence = "configured"
source     = "xz0831 ~/.omlx/settings.json sampling.max_context_window / sampling.max_tokens observed 2026-09-20; current loopback service is unauthenticated"

# Splash runtimes remain cluster-owned, task-scoped services. These identities are intentionally unavailable
# until cluster operations authorizes an endpoint and the host activates it in routes.local.toml.
[sources."splash@rick"]
available = false
auth_env = "SPLASH_RICK_API_KEY"
catalog = "/v1/models"
discover = false
backend = "splash"
billing = "free"

[sources."splash@morty"]
available = false
auth_env = "SPLASH_MORTY_API_KEY"
catalog = "/v1/models"
discover = false
backend = "splash"
billing = "free"

[sources.omlx-tp2]
available = false  # no enrolled TP2 endpoint; retain only the source identity and past observations
catalog  = "/v1/models"
discover = true
backend  = "omlx"
billing  = "free"

[sources.omlx-tp2.limits]
input      = 131072
output     = 32768
confidence = "owned-policy"
source     = "assumed equal to the single-node oMLX settings until S4 measures the TP2 endpoint (down on 2026-09-07)"

[sources.exo]
base_url = "http://127.0.0.1:52416"   # exo-shim (com.rick.exo-shim): folds messages[].role=system into system (exo issue 2193 / PR 2201); the :52415 bundle rejects it
catalog  = "/v1/models"
discover = false   # exo's catalog lists downloadable models, not loaded ones (Plan E, 2026-09-09): declare the loaded ones
backend  = "passthrough"
billing  = "free"

[sources.exo.limits]
input      = 131072
output     = 32768
confidence = "owned-policy"
source     = "placeholder cap until S3 measures exo (not installed on 2026-09-07)"

